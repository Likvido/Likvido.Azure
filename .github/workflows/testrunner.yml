name: "Test Runner"

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  test-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Run tests
        uses: likvido/action-test@v2.0
        with:
          test-target: src/Likvido.Azure.sln
          framework: net10.0
