name: "Test Runner"

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  test-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The .NET 11 SDK builds both targets; the .NET 10 runtime runs the net10.0 tests.
          dotnet-version: |
            10.x
            11.x

      - name: Run tests
        uses: likvido/action-test@v2.0
        with:
          test-target: src/Likvido.Azure.sln
